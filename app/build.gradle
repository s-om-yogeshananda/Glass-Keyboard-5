plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.glasskb.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.glasskb.keyboard'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
