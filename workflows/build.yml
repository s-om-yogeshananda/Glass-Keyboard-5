name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: GlassKeyboard.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build GlassKeyboard.apk --target "${{ github.sha }}" --title "Glass Keyboard (latest build)" --notes "Latest build. Download the APK and install it on your phone." --prerelease
